name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Si subiste el .zip tal cual al repositorio, lo descomprime y localiza el proyecto.
      # Si subiste los archivos ya descomprimidos, usa la raiz del repositorio.
      - name: Descomprimir el zip (si hace falta)
        run: |
          if [ -f build.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            ZIP=$(find . -maxdepth 3 -iname '*.zip' | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "No hay build.gradle ni ningun .zip en el repositorio"; exit 1
            fi
            echo "Descomprimiendo $ZIP"
            mkdir -p "$RUNNER_TEMP/proyecto"
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/proyecto"
            GRADLE_FILE=$(find "$RUNNER_TEMP/proyecto" -name build.gradle | head -n 1)
            if [ -z "$GRADLE_FILE" ]; then
              echo "El zip no contiene build.gradle"; exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"
          fi

      - name: Instalar Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1

      - name: Compilar
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon --stacktrace

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: alive-mod-jar
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
